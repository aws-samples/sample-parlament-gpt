[project]
name = "gov-debates-shared"
version = "0.1.0"
description = "Shared library for the per-government parliamentary-debate fetcher Lambdas."
requires-python = ">=3.11"
# Exact pins, in lockstep with layer-requirements.txt (which is what actually ships in
# the layer): a drift between the two would silently unpin the artifact if the bundling
# exclude list ever changes. See threat model T7.
dependencies = [
    "httpx==0.28.1",
    "boto3==1.43.74",
    # XXE-hardened parsing for adapters that consume upstream XML (CA/FR/NL).
    "defusedxml==0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["python"]
